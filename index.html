<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>借還款管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
.app{max-width:700px;margin:0 auto;padding:16px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.hdr h1{font-size:1.2rem;background:linear-gradient(135deg,#d29922,#ffa657);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:12px}
.card+.card{margin-top:0}
.person{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;transition:.15s;border-bottom:1px solid #21262d}
.person:last-child{border-bottom:none}
.person:hover{background:#1c2128;border-radius:6px}
.p-info{display:flex;flex-direction:column;gap:2px}
.p-name{font-weight:700;font-size:.95rem}
.p-sub{font-size:.72rem;color:#8b949e}
.p-amt{font-size:1.1rem;font-weight:700}
.p-amt.neg{color:#f85149}
.p-amt.ok{color:#3fb950}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.inp{background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:10px 12px;font-size:.85rem;flex:1;min-width:80px}
.inp:focus{outline:none;border-color:#58a6ff}
.sel{background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:10px 12px;font-size:.85rem;min-width:90px;cursor:pointer}
.btn{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:.85rem;transition:.15s;white-space:nowrap}
.btn:hover{background:#30363d}
.btn-p{background:#238636;border-color:#238636;color:#fff;font-weight:600}
.btn-p:hover{background:#2ea043}
.btn-sm{background:transparent;border:1px solid #30363d;color:#8b949e;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.72rem}
.btn-sm:hover{color:#e6edf3;border-color:#8b949e}
.section-title{font-size:.72rem;color:#8b949e;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #21262d;gap:8px}
.tx:last-child{border-bottom:none}
.tx-l{display:flex;flex-direction:column;gap:1px;flex:1}
.tx-n{font-weight:600;font-size:.82rem}
.tx-d{font-size:.65rem;color:#8b949e}
.tx-t{font-size:.6rem;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-block}
.tx-t.l{background:rgba(88,166,255,.15);color:#58a6ff}
.tx-t.i{background:rgba(210,153,34,.15);color:#d29922}
.tx-t.p{background:rgba(63,185,80,.15);color:#3fb950}
.tx-a{font-weight:700;font-size:.9rem;text-align:right;white-space:nowrap}
.tx-a.g{color:#3fb950}
.tx-a.r{color:#f85149}
.tx-x{background:none;border:none;color:#30363d;cursor:pointer;font-size:.9rem;padding:0 4px}
.tx-x:hover{color:#f85149}
.empty{text-align:center;padding:24px;color:#8b949e;font-size:.82rem}
.tot{text-align:right;font-size:.75rem;color:#8b949e;padding-top:8px}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.overlay.s{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;width:90%;max-width:400px}
.modal h2{font-size:1rem;margin-bottom:4px}
.modal .hint{font-size:.82rem;color:#8b949e;margin-bottom:16px}
.modal .ir{display:flex;justify-content:space-between;padding:6px 0;font-size:.85rem;border-bottom:1px solid #21262d}
.modal .big{font-size:1.3rem;font-weight:700;color:#d29922;text-align:center;padding:12px 0}
@media(max-width:480px){.app{padding:12px}.row{flex-direction:column}.inp{min-width:0}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hdr">
    <h1>借還款管理</h1>
    <div style="display:flex;gap:6px">
      <button class="btn-sm" onclick="backup()">備份</button>
      <input type="file" id="fi" accept=".json" style="display:none" onchange="restore(event)">
      <button class="btn-sm" onclick="document.getElementById('fi').click()">還原</button>
    </div>
  </div>

  <div id="summary" class="card" style="padding:0"></div>

  <div class="card">
    <div class="row">
      <input class="inp" type="date" id="d">
      <input class="inp" type="text" id="n" placeholder="借款人" list="nl">
      <datalist id="nl"></datalist>
      <select class="sel" id="t">
        <option value="loan">借款</option>
        <option value="int">還利息</option>
        <option value="prin">還本金</option>
      </select>
      <input class="inp" type="number" id="a" placeholder="金額" min="0">
    </div>
    <div class="row">
      <input class="inp" type="number" id="r" placeholder="年利率 %" step="0.5" style="max-width:160px">
      <span style="font-size:.72rem;color:#8b949e;line-height:36px" id="hint"></span>
      <button class="btn btn-p" onclick="add()">新增</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">交易紀錄</div>
    <div id="list"></div>
  </div>
</div>

<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 id="mn">-</h2>
      <button class="btn-sm" onclick="closeModal()">X</button>
    </div>
    <div id="mc"></div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <input class="inp" type="number" id="mr" placeholder="年利率 %" step="0.5" style="flex:1">
      <button class="btn btn-p" onclick="setRate()">設定</button>
    </div>
  </div>
</div>

<script>
var D={txs:[],rates:{}};

function load(){
  var s=localStorage.getItem('ld');
  if(s){try{D=JSON.parse(s)}catch(e){}}
}
function save(){localStorage.setItem('ld',JSON.stringify(D))}

document.getElementById('d').value=new Date().toISOString().slice(0,10);

function names(){
  var s=new Set();
  D.txs.forEach(function(t){s.add(t.n)});
  return Array.from(s).sort();
}

function upNames(){
  var dl=document.getElementById('nl');
  dl.innerHTML=names().map(function(n){return '<option value="'+n+'">'}).join('');
}

function calc(nm){
  var tx=D.txs.filter(function(t){return t.n===nm});
  var tl=tx.filter(function(t){return t.t==='loan'}).reduce(function(s,t){return s+t.a},0);
  var rp=tx.filter(function(t){return t.t==='prin'}).reduce(function(s,t){return s+t.a},0);
  var ri=tx.filter(function(t){return t.t==='int'}).reduce(function(s,t){return s+t.a},0);
  var rem=Math.max(0,tl-rp);
  
  var ids=tx.filter(function(t){return t.t==='int'}).sort(function(a,b){return b.d.localeCompare(a.d)});
  var lds=tx.filter(function(t){return t.t==='loan'}).sort(function(a,b){return a.d.localeCompare(b.d)});
  var lid=ids.length>0?ids[0].d:(lds.length>0?lds[0].d:null);
  
  var rt=D.rates[nm]||12;
  var intO=0;
  if(lid&&rem>0){
    var last=new Date(lid);
    var now=new Date();
    var days=Math.floor((now-last)/(1000*60*60*24));
    intO=rem*(rt/100)*days/365;
  }
  var uib=Math.max(0,Math.round(intO-ri));
  
  return {tl:tl,rp:rp,rem:rem,ri:ri,uib:uib,tot:rem+uib,rt:rt,lid:lid,cn:tx.length};
}

function render(){
  var ns=names();
  var sum=document.getElementById('summary');
  var hint=document.getElementById('hint');
  
  if(ns.length===0){
    sum.innerHTML='<div class="empty" style="padding:24px">還沒有資料，新增第一筆借款</div>';
    hint.textContent='';
    document.getElementById('list').innerHTML='<div class="empty">還沒有交易紀錄</div>';
    return;
  }
  
  sum.innerHTML=ns.map(function(nm){
    var p=calc(nm);
    var cls=p.tot>0?'neg':'ok';
    return '<div class="person" onclick="showDetail(\''+nm+'\')"><div class="p-info">'+
      '<span class="p-name">'+nm+'</span>'+
      '<span class="p-sub">本金 '+p.tl.toLocaleString()+' | 已還 '+p.rp.toLocaleString()+'</span></div>'+
      '<div class="p-amt '+cls+'">$'+p.tot.toLocaleString()+'</div></div>';
  }).join('');
  
  var ta=ns.reduce(function(s,nm){return s+calc(nm).tot},0);
  hint.textContent='總欠款 $'+ta.toLocaleString();
  
  var sx=Array.from(D.txs).sort(function(a,b){return b.d.localeCompare(a.d)});
  var list=document.getElementById('list');
  list.innerHTML=sx.map(function(tx,i){
    var tl={loan:'借款',int:'還利息',prin:'還本金'}[tx.t];
    var tc={loan:'l',int:'i',prin:'p'}[tx.t];
    var ac=tx.t==='loan'?'r':'g';
    var sg=tx.t==='loan'?'-':'+';
    return '<div class="tx" data-i="'+i+'"><div class="tx-l">'+
      '<span class="tx-n">'+tx.n+' <span class="tx-t '+tc+'">'+tl+'</span></span>'+
      '<span class="tx-d">'+tx.d+'</span></div>'+
      '<div class="tx-a '+ac+'">'+sg+'$'+tx.a.toLocaleString()+'</div>'+
      '<button class="tx-x" onclick="del('+i+')">X</button></div>';
  }).join('');
}

function add(){
  var d=document.getElementById('d').value;
  var n=document.getElementById('n').value.trim();
  var t=document.getElementById('t').value;
  var a=parseInt(document.getElementById('a').value);
  var r=document.getElementById('r').value;
  
  if(!n){alert('請輸入借款人姓名');return}
  if(!a||a<=0){alert('請輸入有效金額');return}
  
  D.txs.push({d:d,n:n,t:t,a:a});
  
  if(r&&parseFloat(r)>0)D.rates[n]=parseFloat(r);
  if(!D.rates[n])D.rates[n]=12;
  
  save();
  upNames();
  render();
  
  document.getElementById('n').value='';
  document.getElementById('a').value='';
  document.getElementById('r').value='';
}

function del(idx){
  if(!confirm('刪除這筆？'))return;
  var sx=Array.from(D.txs).sort(function(a,b){return b.d.localeCompare(a.d)});
  var t=sx[idx];
  var ri=D.txs.findIndex(function(x){return x.d===t.d&&x.n===t.n&&x.t===t.t&&x.a===t.a});
  if(ri!==-1){D.txs.splice(ri,1);save();render()}
}

function showDetail(nm){
  var p=calc(nm);
  document.getElementById('mn').textContent=nm;
  document.getElementById('mr').value=D.rates[nm]||12;
  document.getElementById('mc').innerHTML=
    '<div class="big">欠款 $'+p.tot.toLocaleString()+'</div>'+
    '<div class="ir"><span>原始本金</span><span style="color:#58a6ff">$'+p.tl.toLocaleString()+'</span></div>'+
    '<div class="ir"><span>已還本金</span><span style="color:#3fb950">$'+p.rp.toLocaleString()+'</span></div>'+
    '<div class="ir"><span>剩餘本金</span><span style="color:#d29922">$'+p.rem.toLocaleString()+'</span></div>'+
    '<div class="ir"><span>已付利息</span><span style="color:#3fb950">$'+p.ri.toLocaleString()+'</span></div>'+
    '<div class="ir"><span>未付利息</span><span style="color:#f85149">$'+p.uib.toLocaleString()+'</span></div>'+
    '<div class="ir"><span>年利率</span><span>'+(D.rates[nm]||12)+'%</span></div>'+
    '<div class="ir"><span>交易次數</span><span>'+p.cn+' 筆</span></div>';
  document.getElementById('modal').classList.add('s');
}

function closeModal(){document.getElementById('modal').classList.remove('s')}

function setRate(){
  var nm=document.getElementById('mn').textContent;
  var r=parseFloat(document.getElementById('mr').value);
  if(r>0&&r<=100){D.rates[nm]=r;save();showDetail(nm)}
}

function backup(){
  var b=new Blob([JSON.stringify(D)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='loan_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function restore(e){
  var f=e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(d.txs&&Array.isArray(d.txs)){D=d;save();upNames();render();alert('OK')}
    }catch(e){alert('錯誤')}
  };
  r.readAsText(f);
  e.target.value='';
}

load();
upNames();
render();
</script>
</body>
</html>
